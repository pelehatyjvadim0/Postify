<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f0e9">
    <title>Postify — обзор</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23294b38' d='M6 22C6 10 17 5 27 5c0 11-6 21-19 21 4-6 9-10 14-14-7 3-12 7-16 10Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#screen-root">Перейти к содержимому</a>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" aria-label="Боковая панель">
        <div class="brand" aria-label="Postify">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path class="brand-leaf brand-leaf-left" d="M15 1.4C6.8 2.2 1.2 8.5 1.2 17.1c0 5.2 1.9 9.4 5.8 12.8 4.1-3.8 6.7-8.4 7.8-13.7.7-5.4.4-10.7.2-14.8Z"/>
            <path class="brand-leaf brand-leaf-top" d="M17.2 14.9c8-.4 12.6-5.1 13.4-13.4-8.3.3-12.9 4.9-13.4 13.4Z"/>
            <path class="brand-leaf brand-leaf-bottom" d="M7.8 24.9c2.7-3.8 6-6.2 9.4-7.2h13.5c-.1 4.5-1.6 8-4.6 10.3-5.8 4.2-13.1 2.7-18.3-3.1Z"/>
            <path class="brand-cut" d="M16.1 16.4 6.8 28.1"/>
          </svg>
          <span class="brand-name">Postify</span>
        </div>

        <button class="farm-switcher" id="farm-switcher" type="button" aria-haspopup="listbox">
          <span class="farm-avatar" aria-hidden="true">Т</span>
          <span class="farm-copy">
            <span class="farm-label">Контентный контур</span>
            <strong>Технологии просто</strong>
          </span>
          <span aria-hidden="true">⌄</span>
        </button>

        <nav class="app-nav" id="app-nav" aria-label="Основная навигация">
          <p class="nav-label">Работа</p>
          <a class="nav-link" href="#overview" data-route="overview">
            <span class="nav-icon" aria-hidden="true">⌂</span><span>Обзор</span>
          </a>
          <a class="nav-link" href="#materials" data-route="materials">
            <span class="nav-icon" aria-hidden="true">⌕</span><span>Материалы</span>
          </a>
          <a class="nav-link" href="#review" data-route="review">
            <span class="nav-icon" aria-hidden="true">✓</span><span>Проверка</span>
            <span class="nav-count" data-nav-count="review">4</span>
          </a>
          <a class="nav-link" href="#queue" data-route="queue">
            <span class="nav-icon" aria-hidden="true">◷</span><span>Очередь</span>
          </a>
          <a class="nav-link" href="#publications" data-route="publications">
            <span class="nav-icon" aria-hidden="true">↗</span><span>Публикации</span>
          </a>
          <a class="nav-link" href="#journal" data-route="journal">
            <span class="nav-icon" aria-hidden="true">≡</span><span>Журнал</span>
          </a>

          <p class="nav-label nav-label--future">Развитие</p>
          <span class="nav-link nav-link--disabled" aria-disabled="true">
            <span class="nav-icon" aria-hidden="true">⚙</span><span>Настройки фермы</span>
            <span class="future-dot" title="Следующий этап"></span>
          </span>
          <span class="nav-link nav-link--disabled" aria-disabled="true">
            <span class="nav-icon" aria-hidden="true">⌁</span><span>Аналитика</span>
            <span class="future-dot" title="Следующий этап"></span>
          </span>
        </nav>

        <div class="sidebar-footer">
          <div class="system-pulse">
            <span class="status-dot status-dot--ok"></span>
            <span><strong>Система работает</strong><small>Обновлено только что</small></span>
          </div>
          <button class="button button--quiet button--full" id="demo-reset" type="button">
            Сбросить демо
          </button>
        </div>
      </aside>

      <main class="main-stage">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="screen-eyebrow">Рабочая панель</p>
            <h1 id="screen-title">Сегодня</h1>
          </div>
          <div class="topbar-actions">
            <span class="demo-badge"><span></span> Демо-режим</span>
            <button class="date-control" type="button" aria-label="Выбрать дату">
              <span aria-hidden="true">▣</span><span>12 августа 2026</span><span aria-hidden="true">⌄</span>
            </button>
            <button class="button button--primary" type="button" data-action="new-run">
              <span aria-hidden="true">＋</span> Новый поиск
            </button>
          </div>
        </header>

        <div class="screen-root" id="screen-root" tabindex="-1"></div>
      </main>

      <nav class="mobile-nav" aria-label="Мобильная навигация">
        <a href="#overview" data-route="overview"><span aria-hidden="true">⌂</span><small>Обзор</small></a>
        <a href="#materials" data-route="materials"><span aria-hidden="true">⌕</span><small>Материалы</small></a>
        <a href="#review" data-route="review"><span aria-hidden="true">✓</span><small>Проверка</small></a>
        <a href="#queue" data-route="queue"><span aria-hidden="true">◷</span><small>Очередь</small></a>
        <button type="button" data-action="open-mobile-menu"><span aria-hidden="true">•••</span><small>Ещё</small></button>
      </nav>
    </div>

    <dialog class="detail-layer" id="detail-layer" aria-modal="true" aria-labelledby="detail-title">
      <div id="detail-content"></div>
    </dialog>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
  </body>
</html>
