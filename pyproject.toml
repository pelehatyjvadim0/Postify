[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "postify"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "httpx",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy",
    "typer",
]

[project.scripts]
postify = "postify.cli:app"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
