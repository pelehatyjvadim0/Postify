name: autoposttg

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: autopost
      POSTGRES_PASSWORD: autopost-local
      POSTGRES_DB: autoposttg
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopost -d autoposttg"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://autopost:autopost-local@db:5432/autoposttg
      CONTENT_MEDIA_DIR: /data/media
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MEDIA_PROVIDER: ${AI_MEDIA_PROVIDER:-auto}
      CONTENT_ANALYZER: ${CONTENT_ANALYZER:-codex}
      CONTENT_MODEL: ${CONTENT_MODEL:-gpt-5.6-terra}
      CODEX_HOME: /data/codex
      AUTOPOST_RELOAD: "1"
      AUTOPOST_BIND: ${AUTOPOST_BIND:-127.0.0.1}
      AUTH_BOT_TOKEN: ${AUTH_BOT_TOKEN:-}
      AUTH_BOT_USERNAME: ${AUTH_BOT_USERNAME:-}
      AUTH_ALLOWED_TELEGRAM_IDS: ${AUTH_ALLOWED_TELEGRAM_IDS:-}
      POSTIFY_TRUSTED_HOSTS: ${POSTIFY_TRUSTED_HOSTS:-}
    ports:
      - "${AUTOPOST_BIND:-127.0.0.1}:${AUTOPOST_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - ./src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  test-db:
    image: pgvector/pgvector:pg17
    profiles: [test]
    environment:
      POSTGRES_USER: autopost_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: autoposttg_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopost_test -d autoposttg_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://autopost_test:test-only@test-db:5432/autoposttg_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  database:
  app-data:
